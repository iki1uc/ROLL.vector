<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ROLL · POS · HOUDINI · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:40px; }
pre { background:#111; padding:20px; border-left:4px solid #0ff; }
</style>
</head>

<body>

<h1>ROLL · POS · HOUDINI · iki1uc</h1>

<pre id="out">Starte Engine…</pre>

<script type="module">
import { ROLL_VECTOR } from "./ROLL.vector.js";
import { POS_VECTOR } from "./pos.vector";
import { HOUDINI_VECTOR } from "./Houdini.vector.js";

let frame = 0;

async function ENGINE(){

    // POS laden
    let pos = POS_VECTOR(frame);

    // Fallback wenn pos leer ist
    if(!pos || !pos.x){
        pos = HOUDINI_VECTOR(frame);
    }

    // Roll‑Move
    const roll = ROLL_VECTOR({
        x: pos.x,
        y: pos.y,
        z: pos.z,
        frame
    });

    // Ausgabe
    document.getElementById("out").textContent =
        JSON.stringify({ frame, pos, roll }, null, 2);

    frame++;
    requestAnimationFrame(ENGINE);
}

ENGINE();
</script>

</body>
</html>
