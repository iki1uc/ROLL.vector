<script type="module">
import { ROLL_VECTOR } from "./ROLL.vector.js";
import { POS_VECTOR } from "./pos.vector";

let frame = 0;

async function start(){

    const pos = POS_VECTOR(frame);

    const roll = ROLL_VECTOR({
        x: pos.x,
        y: pos.y,
        z: pos.z,
        frame
    });

    document.getElementById("out").textContent =
        JSON.stringify({ pos, roll }, null, 2);

    frame++;
    requestAnimationFrame(start);
}

start();
</script>
